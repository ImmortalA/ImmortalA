name: Robot training (sim-to-real)

on:
  schedule:
    - cron: "0 0 * * *"   # daily UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/generate_robot_training_svg.py"
      - ".github/workflows/robot-training.yml"

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate robot training SVG
        run: |
          python3 scripts/generate_robot_training_svg.py \
            "${{ github.repository_owner }}" \
            "${{ github.token }}" \
            assets/robot-training.svg

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/robot-training.svg
          git diff --staged --quiet || git commit -m "chore: update robot training SVG"
          git push
